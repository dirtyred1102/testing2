name: Track cruise price

on:
  schedule:
    # Once a day. GitHub may delay scheduled runs slightly during busy periods.
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run price tracker
        run: python scripts/track_price.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated price history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.csv
          if git diff --cached --quiet; then
            echo "No price change to commit."
          else
            git commit -m "Record cruise price $(date -u +%Y-%m-%d)"
            git push
          fi
